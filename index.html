document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

style=\"width: 22px; height: 18px; border: 2.5px solid oklch(0.4 0.07 150); border-radius: 5px; position: relative;\">\n                    <div style=\"position: absolute; width: 8px; height: 8px; border-radius: 50%; border: 2.5px solid oklch(0.4 0.07 150); top: 50%; left: 50%; transform: translate(-50%,-50%);\"><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div>\n                  <div style=\"font-size: 16px; font-weight: 700; color: oklch(0.3 0.03 150); margin-bottom: 4px;\">Add wildlife photo<\u002Fdiv>\n                  <div style=\"font-size: 13px; color: oklch(0.52 0.02 150); line-height: 1.45; max-width: 300px;\">Use a photo taken at the property with location turned on. We read the GPS automatically.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Flabel>\n            <\u002Fsc-if>\n\n            <!-- photo preview + analysis -->\n            <sc-if value=\"{{ hasPhoto }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display: flex; flex-direction: column; gap: 14px; animation: fadeUp .3s ease;\">\n\n                <div style=\"position: relative; border-radius: 16px; overflow: hidden; background: oklch(0.3 0.02 150);\">\n                  <img ref=\"{{ photoImgRef }}\" src=\"data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==\" alt=\"snake sighting\" style=\"display: block; width: 100%; height: 320px; max-height: 60vh; object-fit: cover; background-color: oklch(0.3 0.02 150);\">\n                  <button onclick=\"{{ removePhoto }}\" style=\"position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; border: none; border-radius: 50%; background: oklch(0.2 0.01 150 / 0.6); color: #fff; font-size: 16px; cursor: pointer; backdrop-filter: blur(4px); line-height: 1;\">×<\u002Fbutton>\n                <\u002Fdiv>\n\n                <!-- parsing -->\n                <sc-if value=\"{{ parsing }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display: flex; align-items: center; gap: 11px; padding: 14px 16px; background: oklch(0.99 0.008 92); border: 1px solid oklch(0.9 0.014 92); border-radius: 12px;\">\n                    <div style=\"width: 18px; height: 18px; border: 2.5px solid oklch(0.86 0.02 150); border-top-color: oklch(0.46 0.055 150); border-radius: 50%; animation: spin .7s linear infinite;\"><\u002Fdiv>\n                    <span style=\"font-size: 13.5px; font-weight: 600; color: oklch(0.45 0.02 150);\">Reading photo location &amp; date…<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n                <!-- PASS banner -->\n                <sc-if value=\"{{ showPass }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display: flex; gap: 12px; padding: 14px 16px; background: oklch(0.95 0.04 150); border: 1px solid oklch(0.82 0.07 150); border-radius: 12px;\">\n                    <div style=\"width: 22px; height: 22px; border-radius: 50%; background: oklch(0.46 0.08 150); flex-shrink: 0; display: flex; align-items: center; justify-content: center;\">\n                      <div style=\"width: 6px; height: 11px; border-right: 2.5px solid #fff; border-bottom: 2.5px solid #fff; transform: rotate(45deg); margin-top: -2px;\"><\u002Fdiv>\n                    <\u002Fdiv>\n                    <div>\n                      <div style=\"font-size: 14px; font-weight: 700; color: oklch(0.34 0.06 150);\">Inside the reporting zone<\u002Fdiv>\n                      <div style=\"font-size: 12.5px; color: oklch(0.42 0.04 150); margin-top: 2px; font-family: 'DM Mono', monospace;\">{{ distanceText }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n                <!-- FAIL: out of range -->\n                <sc-if value=\"{{ showFailRange }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display: flex; gap: 12px; padding: 14px 16px; background: oklch(0.95 0.045 55); border: 1px solid oklch(0.82 0.09 55); border-radius: 12px;\">\n                    <div style=\"width: 22px; height: 22px; border-radius: 50%; background: oklch(0.55 0.13 45); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 14px; line-height: 1;\">!<\u002Fdiv>\n                    <div>\n                      <div style=\"font-size: 14px; font-weight: 700; color: oklch(0.43 0.1 45);\">Outside the 1,000 ft zone<\u002Fdiv>\n                      <div style=\"font-size: 12.5px; color: oklch(0.46 0.08 45); margin-top: 3px; line-height: 1.45;\">You can still submit — this report will be tagged <strong>location unverified<\u002Fstrong> so others know to take it with a grain of salt. <span style=\"font-family: 'DM Mono', monospace;\">{{ distanceText }}<\u002Fspan><\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n                <!-- FAIL: no gps -->\n                <sc-if value=\"{{ showNoGps }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display: flex; gap: 12px; padding: 14px 16px; background: oklch(0.95 0.045 55); border: 1px solid oklch(0.82 0.09 55); border-radius: 12px;\">\n                    <div style=\"width: 22px; height: 22px; border-radius: 50%; background: oklch(0.55 0.13 45); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 14px; line-height: 1;\">!<\u002Fdiv>\n                    <div>\n                      <div style=\"font-size: 14px; font-weight: 700; color: oklch(0.43 0.1 45);\">No location found in this photo<\u002Fdiv>\n                      <div style=\"font-size: 12.5px; color: oklch(0.46 0.08 45); margin-top: 3px; line-height: 1.45;\">You can still submit — it'll be tagged <strong>location unverified<\u002Fstrong>. To verify the spot, turn your camera's location on and take a fresh photo at the property. (Screenshots and shared/downloaded images usually have no GPS.)<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n                <!-- coord readout -->\n                <sc-if value=\"{{ showReadout }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: oklch(0.9 0.014 92); border: 1px solid oklch(0.9 0.014 92); border-radius: 12px; overflow: hidden; font-family: 'DM Mono', monospace;\">\n                    <div style=\"background: oklch(0.99 0.008 92); padding: 11px 14px;\">\n                      <div style=\"font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: oklch(0.6 0.015 150); margin-bottom: 3px;\">Latitude<\u002Fdiv>\n                      <div style=\"font-size: 14px; font-weight: 500; color: oklch(0.3 0.02 150);\">{{ latText }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"background: oklch(0.99 0.008 92); padding: 11px 14px;\">\n                      <div style=\"font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: oklch(0.6 0.015 150); margin-bottom: 3px;\">Longitude<\u002Fdiv>\n                      <div style=\"font-size: 14px; font-weight: 500; color: oklch(0.3 0.02 150);\">{{ lngText }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n                <!-- map -->\n                <sc-if value=\"{{ showMap }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div ref=\"{{ reportMapRef }}\" style=\"height: 240px; width: 100%; border-radius: 12px; overflow: hidden; border: 1px solid oklch(0.9 0.014 92); z-index: 0;\"><\u002Fdiv>\n                <\u002Fsc-if>\n\n                <!-- date/time + notes + submit -->\n                <sc-if value=\"{{ showForm }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display: flex; flex-direction: column; gap: 16px; margin-top: 2px;\">\n\n                    <div>\n                      <div style=\"display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px;\">\n                        <label style=\"font-size: 13px; font-weight: 700; color: oklch(0.34 0.03 150);\">When was it taken?<\u002Flabel>\n                        <sc-if value=\"{{ dateFromPhoto }}\" hint-placeholder-val=\"{{ false }}\">\n                          <span style=\"font-size: 11px; font-weight: 600; color: oklch(0.46 0.06 150); background: oklch(0.93 0.03 150); padding: 3px 8px; border-radius: 6px; font-family: 'DM Mono', monospace;\">from photo<\u002Fspan>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ dateNeedsEntry }}\" hint-placeholder-val=\"{{ false }}\">\n                          <span style=\"font-size: 11px; font-weight: 600; color: oklch(0.5 0.08 55); background: oklch(0.94 0.04 55); padding: 3px 8px; border-radius: 6px; font-family: 'DM Mono', monospace;\">enter manually<\u002Fspan>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n                      <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 10px;\">\n                        <input type=\"date\" value=\"{{ manualDate }}\" onchange=\"{{ setDate }}\" style=\"padding: 12px 13px; border: 1px solid oklch(0.85 0.02 150); border-radius: 11px; background: oklch(0.99 0.008 92); font-size: 14px; font-weight: 600; color: oklch(0.3 0.02 150);\">\n                        <input type=\"time\" value=\"{{ manualTime }}\" onchange=\"{{ setTime }}\" style=\"padding: 12px 13px; border: 1px solid oklch(0.85 0.02 150); border-radius: 11px; background: oklch(0.99 0.008 92); font-size: 14px; font-weight: 600; color: oklch(0.3 0.02 150);\">\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n\n                    <div>\n                      <label style=\"display: block; font-size: 13px; font-weight: 700; color: oklch(0.34 0.03 150); margin-bottom: 8px;\">Notes for other guests<\u002Flabel>\n                      <textarea value=\"{{ notes }}\" onchange=\"{{ setNotes }}\" placeholder=\"Where exactly did you see it? Color, size, and what it was doing — anything that helps others stay clear.\" rows=\"4\" style=\"width: 100%; padding: 13px; border: 1px solid oklch(0.85 0.02 150); border-radius: 11px; background: oklch(0.99 0.008 92); font-size: 14px; color: oklch(0.3 0.02 150); resize: vertical; line-height: 1.5;\"><\u002Ftextarea>\n                    <\u002Fdiv>\n\n                    <sc-if value=\"{{ hasError }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"font-size: 12.5px; color: oklch(0.5 0.1 45); background: oklch(0.95 0.04 55); border: 1px solid oklch(0.85 0.07 55); padding: 10px 13px; border-radius: 10px;\">{{ lastError }}<\u002Fdiv>\n                    <\u002Fsc-if>\n\n                    <div>\n                      <button onclick=\"{{ submit }}\" disabled=\"{{ submitDisabled }}\" style=\"{{ submitBtnStyle }}\">{{ submitLabel }}<\u002Fbutton>\n                      <sc-if value=\"{{ submitDisabled }}\" hint-placeholder-val=\"{{ false }}\">\n                        <p style=\"margin: 9px 0 0; text-align: center; font-size: 12.5px; color: oklch(0.55 0.02 150); font-weight: 600;\">{{ reason }}<\u002Fp>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ============ SIGHTINGS TAB ============ -->\n    <sc-if value=\"{{ isSightings }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation: fadeUp .25s ease;\">\n\n        <div style=\"display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;\">\n          <span style=\"font-size: 13px; font-weight: 700; color: oklch(0.4 0.03 150); font-family: 'DM Mono', monospace;\">{{ recordCount }} logged<\u002Fspan>\n          <div style=\"display: flex; gap: 4px; background: oklch(0.92 0.014 92); padding: 4px; border-radius: 10px; width: 188px;\">\n            <button onclick=\"{{ setGalleryGrid }}\" style=\"{{ galleryGridStyle }}\">Gallery<\u002Fbutton>\n            <button onclick=\"{{ setGalleryMapView }}\" style=\"{{ galleryMapStyle }}\">Map<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ hasRecords }}\" hint-placeholder-val=\"{{ false }}\">\n          <div>\n            <!-- gallery grid -->\n            <sc-if value=\"{{ isGalleryGrid }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n                <sc-for list=\"{{ galleryItems }}\" as=\"item\" hint-placeholder-count=\"0\">\n                  <div style=\"display: flex; gap: 13px; background: oklch(0.99 0.008 92); border: 1px solid oklch(0.9 0.014 92); border-radius: 14px; padding: 12px; align-items: stretch;\">\n                    <img ref=\"{{ item.imgRef }}\" src=\"data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==\" onclick=\"{{ item.open }}\" alt=\"sighting\" style=\"width: 96px; height: 96px; object-fit: cover; border-radius: 10px; cursor: pointer; flex-shrink: 0; background-color: oklch(0.3 0.02 150);\">\n                    <div style=\"display: flex; flex-direction: column; min-width: 0; flex: 1;\">\n                      <div style=\"display: flex; align-items: center; gap: 7px; margin-bottom: 5px; flex-wrap: wrap;\">\n                        <span style=\"font-size: 12px; font-weight: 700; color: oklch(0.34 0.03 150); font-family: 'DM Mono', monospace;\">{{ item.dateText }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"display: flex; gap: 6px; margin-bottom: 7px; flex-wrap: wrap;\">\n                        <span style=\"{{ item.verifyStyle }}\">{{ item.verifyText }}<\u002Fspan>\n                        <span style=\"font-size: 10.5px; font-weight: 600; color: oklch(0.4 0.06 150); background: oklch(0.93 0.03 150); padding: 2px 7px; border-radius: 6px; font-family: 'DM Mono', monospace;\">{{ item.distText }}<\u002Fspan>\n                        <span style=\"font-size: 10.5px; font-weight: 600; color: oklch(0.45 0.05 60); background: oklch(0.94 0.025 70); padding: 2px 7px; border-radius: 6px; font-family: 'DM Mono', monospace;\">{{ item.storageText }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <p style=\"margin: 0; font-size: 13px; color: oklch(0.42 0.02 150); line-height: 1.45; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;\">{{ item.notes }}<\u002Fp>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <!-- map view -->\n            <sc-if value=\"{{ isGalleryMap }}\" hint-placeholder-val=\"{{ false }}\">\n              <div ref=\"{{ galleryMapRef }}\" style=\"height: 380px; width: 100%; border-radius: 14px; overflow: hidden; border: 1px solid oklch(0.9 0.014 92); z-index: 0;\"><\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ noRecords }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"text-align: center; padding: 50px 24px; background: oklch(0.99 0.008 92); border: 1px dashed oklch(0.85 0.02 150); border-radius: 16px;\">\n            <div style=\"width: 46px; height: 46px; border-radius: 13px; background: oklch(0.93 0.025 150); margin: 0 auto 14px; display: flex; align-items: center; justify-content: center;\">\n              <div style=\"width: 13px; height: 13px; background: oklch(0.6 0.04 150); transform: rotate(45deg); border-radius: 3px;\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size: 15px; font-weight: 700; color: oklch(0.4 0.03 150); margin-bottom: 5px;\">No sightings yet<\u002Fdiv>\n            <div style=\"font-size: 13px; color: oklch(0.55 0.02 150);\">Reports you submit appear here. To show a shared list across all guests, connect a cloud list endpoint (see setup).<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n\n  <!-- lightbox -->\n  <sc-if value=\"{{ hasLightbox }}\" hint-placeholder-val=\"{{ false }}\">\n    <div onclick=\"{{ closeLightbox }}\" style=\"position: fixed; inset: 0; background: oklch(0.18 0.01 150 / 0.85); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 1000; backdrop-filter: blur(3px);\">\n      <img ref=\"{{ lightboxImgRef }}\" src=\"data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==\" alt=\"sighting\" style=\"max-width: 100%; max-height: 100%; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);\">\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  config = {\n    target: { lat: 34.53660217926452, lng: -93.50081788334796 },\n    radiusFeet: 1000,\n    uploadEndpoint: 'https://7wstcuqfu5.execute-api.us-east-2.amazonaws.com/upload', // POST endpoint returning { uploadUrl, key }\n    listEndpoint: 'https://7wstcuqfu5.execute-api.us-east-2.amazonaws.com/sightings', // GET endpoint returning a shared array of records\n    region: 'us-east-2',\n    bucket: 'snake-watch-photos-356325055182-us-east-2-an',\n  };\n\n  state = {\n    tab: 'report',\n    galleryView: 'gallery',\n    photo: null,\n    exif: null,\n    parsing: false,\n    manualDate: '',\n    manualTime: '',\n    dateSource: null,\n    notes: '',\n    records: [],\n    submitting: false,\n    submitted: false,\n    lastError: '',\n    lightbox: null,\n  };\n\n  componentDidMount() {\n    // Records are kept in memory for the current session only. The shared,\n    // cross-guest list comes from the cloud (see config.listEndpoint below).\n    if (this.config.listEndpoint) this.loadFromCloud();\n  }\n\n  async loadFromCloud() {\n    try {\n      const res = await fetch(this.config.listEndpoint);\n      if (!res.ok) return;\n      const list = await res.json();\n      if (Array.isArray(list)) this.setState({ records: list });\n    } catch (e) {}\n  }\n\n  setImgSrc(node, url) {\n    if (node && url && node.getAttribute('src') !== url) node.src = url;\n  }\n\n  distanceFeet(lat, lng) {\n    const R = 6371000, toRad = (d) => d * Math.PI / 180, t = this.config.target;\n    const dLat = toRad(lat - t.lat), dLng = toRad(lng - t.lng);\n    const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(t.lat)) * Math.cos(toRad(lat)) * Math.sin(dLng / 2) ** 2;\n    return 2 * R * Math.asin(Math.sqrt(a)) * 3.28084;\n  }\n\n  pad(n) { return String(n).padStart(2, '0'); }\n  fmtDate(d) { return d.getFullYear() + '-' + this.pad(d.getMonth() + 1) + '-' + this.pad(d.getDate()); }\n  fmtTime(d) { return this.pad(d.getHours()) + ':' + this.pad(d.getMinutes()); }\n\n  async extractGps(file) {\n    const ok = (la, ln) => Number.isFinite(la) && Number.isFinite(ln) && !(la === 0 && ln === 0)\n      && Math.abs(la) <= 90 && Math.abs(ln) <= 180;\n    // 1) high-level helper\n    try {\n      const g = await exifr.gps(file);\n      if (g && ok(g.latitude, g.longitude)) return { lat: g.latitude, lng: g.longitude };\n    } catch (e) {}\n    // 2) full parse with translated GPS block\n    try {\n      const o = await exifr.parse(file, { gps: true, translateValues: true });\n      if (o && ok(o.latitude, o.longitude)) return { lat: o.latitude, lng: o.longitude };\n    } catch (e) {}\n    // 3) raw GPS tags -> manual degrees/minutes/seconds conversion\n    try {\n      const t = await exifr.parse(file, { gps: true, translateValues: false, reviveValues: false });\n      if (t && t.GPSLatitude && t.GPSLongitude) {\n        const dec = (v) => Array.isArray(v) ? (+v[0] || 0) + (+v[1] || 0) / 60 + (+v[2] || 0) / 3600 : +v;\n        let lat = dec(t.GPSLatitude), lng = dec(t.GPSLongitude);\n        const latRef = String(t.GPSLatitudeRef || 'N').toUpperCase();\n        const lngRef = String(t.GPSLongitudeRef || 'E').toUpperCase();\n        if (latRef[0] === 'S') lat = -Math.abs(lat);\n        if (lngRef[0] === 'W') lng = -Math.abs(lng);\n        if (ok(lat, lng)) return { lat, lng };\n      }\n    } catch (e) {}\n    return null;\n  }\n\n  onFileChange = async (e) => {\n    const file = e.target.files && e.target.files[0];\n    if (!file) return;\n    this.setState({ parsing: true, photo: null, exif: null, submitted: false, lastError: '' });\n    try {\n      const dataUrl = await this.downscale(file);\n      let coords = null, dateObj = null;\n      if (typeof exifr !== 'undefined') {\n        coords = await this.extractGps(file);\n        try {\n          const meta = await exifr.parse(file, ['DateTimeOriginal', 'CreateDate', 'ModifyDate']);\n          if (meta) dateObj = meta.DateTimeOriginal || meta.CreateDate || meta.ModifyDate || null;\n        } catch (err) {}\n      }\n      let exif = { lat: null, lng: null, distanceFt: null, withinRange: false };\n      if (coords) {\n        const distanceFt = this.distanceFeet(coords.lat, coords.lng);\n        exif = { lat: coords.lat, lng: coords.lng, distanceFt, withinRange: distanceFt <= this.config.radiusFeet };\n      }\n      const upd = { photo: { dataUrl, name: file.name, file, type: file.type || 'image/jpeg' }, exif, parsing: false };\n      if (dateObj && !isNaN(dateObj.getTime())) {\n        upd.manualDate = this.fmtDate(dateObj);\n        upd.manualTime = this.fmtTime(dateObj);\n        upd.dateSource = 'photo';\n      } else {\n        upd.dateSource = 'manual';\n      }\n      this.setState(upd, () => this.refreshReportMap());\n    } catch (err) {\n      this.setState({ parsing: false, lastError: 'Could not read that image. Please try another photo.' });\n    }\n  };\n\n  downscale(file, max = 1280, q = 0.82) {\n    return new Promise((resolve, reject) => {\n      const url = URL.createObjectURL(file);\n      const img = new Image();\n      img.onload = () => {\n        let w = img.width, h = img.height;\n        const scale = Math.min(1, max / Math.max(w, h));\n        w = Math.round(w * scale); h = Math.round(h * scale);\n        const c = document.createElement('canvas');\n        c.width = w; c.height = h;\n        c.getContext('2d').drawImage(img, 0, 0, w, h);\n        URL.revokeObjectURL(url);\n        try { resolve(c.toDataURL('image/jpeg', q)); } catch (err) { reject(err); }\n      };\n      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('img')); };\n      img.src = url;\n    });\n  }\n\n  removePhoto = () => this.setState({ photo: null, exif: null, lastError: '', dateSource: null }, () => this.refreshReportMap());\n\n  reportMapRef = (node) => {\n    if (node) { this.initMap(node, 'report'); }\n    else if (this.reportMap) { this.reportMap.remove(); this.reportMap = null; }\n  };\n  galleryMapRef = (node) => {\n    if (node) { this.initMap(node, 'gallery'); }\n    else if (this.galleryMap) { this.galleryMap.remove(); this.galleryMap = null; }\n  };\n\n  initMap(node, which, attempt = 0) {\n    if (typeof L === 'undefined') {\n      if (attempt < 25) setTimeout(() => this.initMap(node, which, attempt + 1), 150);\n      return;\n    }\n    if (which === 'report' && this.reportMap) return;\n    if (which === 'gallery' && this.galleryMap) return;\n    const t = this.config.target;\n    const map = L.map(node, { zoomControl: true, scrollWheelZoom: false, attributionControl: true });\n    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);\n    const radiusM = this.config.radiusFeet / 3.28084;\n    L.circle([t.lat, t.lng], { radius: radiusM, color: 'oklch(0.46 0.06 150)', weight: 1.5, fillColor: 'oklch(0.46 0.06 150)', fillOpacity: 0.08 }).addTo(map);\n    L.circleMarker([t.lat, t.lng], { radius: 6, color: '#fff', weight: 2, fillColor: 'oklch(0.33 0.04 150)', fillOpacity: 1 }).addTo(map).bindTooltip('The rental');\n    map.setView([t.lat, t.lng], 16);\n    if (which === 'report') { this.reportMap = map; this._reportLayer = L.layerGroup().addTo(map); this.refreshReportMap(); }\n    else { this.galleryMap = map; this._galleryLayer = L.layerGroup().addTo(map); this.refreshGalleryMap(); }\n    setTimeout(() => { try { map.invalidateSize(); } catch (e) {} }, 250);\n  }\n\n  refreshReportMap() {\n    if (!this.reportMap || !this._reportLayer) return;\n    this._reportLayer.clearLayers();\n    const ex = this.state.exif, t = this.config.target;\n    if (ex && Number.isFinite(ex.lat) && Number.isFinite(ex.lng)) {\n      const color = ex.withinRange ? 'oklch(0.46 0.06 150)' : 'oklch(0.55 0.13 45)';\n      L.circleMarker([ex.lat, ex.lng], { radius: 8, color: '#fff', weight: 2, fillColor: color, fillOpacity: 1 }).addTo(this._reportLayer).bindTooltip('Photo location');\n      try { this.reportMap.fitBounds(L.latLngBounds([[ex.lat, ex.lng], [t.lat, t.lng]]).pad(0.6)); } catch (e) {}\n    } else {\n      this.reportMap.setView([t.lat, t.lng], 16);\n    }\n    setTimeout(() => { try { this.reportMap.invalidateSize(); } catch (e) {} }, 120);\n  }\n\n  refreshGalleryMap() {\n    if (!this.galleryMap || !this._galleryLayer) return;\n    this._galleryLayer.clearLayers();\n    const pts = [], t = this.config.target;\n    this.state.records.forEach((r) => {\n      if (Number.isFinite(r.lat) && Number.isFinite(r.lng)) {\n        L.circleMarker([r.lat, r.lng], { radius: 7, color: '#fff', weight: 2, fillColor: 'oklch(0.55 0.13 45)', fillOpacity: 1 })\n          .addTo(this._galleryLayer).bindTooltip(r.notes ? r.notes.slice(0, 50) : 'Sighting');\n        pts.push([r.lat, r.lng]);\n      }\n    });\n    pts.push([t.lat, t.lng]);\n    if (pts.length > 1) { try { this.galleryMap.fitBounds(L.latLngBounds(pts).pad(0.35)); } catch (e) {} }\n    setTimeout(() => { try { this.galleryMap.invalidateSize(); } catch (e) {} }, 120);\n  }\n\n  setTab = (tab) => this.setState({ tab }, () => { if (tab === 'sightings' && this.state.galleryView === 'map') setTimeout(() => this.refreshGalleryMap(), 60); });\n  setGalleryView = (galleryView) => this.setState({ galleryView }, () => { if (galleryView === 'map') setTimeout(() => this.refreshGalleryMap(), 60); });\n  setNotes = (e) => this.setState({ notes: e.target.value });\n  setDate = (e) => this.setState({ manualDate: e.target.value });\n  setTime = (e) => this.setState({ manualTime: e.target.value });\n\n  dataURLtoBlob(dataUrl) {\n    const [meta, b64] = dataUrl.split(',');\n    const mime = meta.match(/:(.*?);/)[1];\n    const bin = atob(b64), arr = new Uint8Array(bin.length);\n    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);\n    return new Blob([arr], { type: mime });\n  }\n\n  async uploadToS3(record, file) {\n    // Upload the ORIGINAL file bytes (EXIF intact) so the server can re-verify GPS.\n    // Fall back to the downscaled preview only if the original is unavailable.\n    const blob = file || this.dataURLtoBlob(record.dataUrl);\n    const contentType = (file && file.type) || 'image/jpeg';\n    const extMap = { 'image/jpeg': 'jpg', 'image/jpg': 'jpg', 'image/png': 'png', 'image/heic': 'heic', 'image/heif': 'heif', 'image/webp': 'webp' };\n    const ext = extMap[contentType] || 'jpg';\n    const key = 'sightings/' + record.id + '.' + ext;\n    const res = await fetch(this.config.uploadEndpoint, {\n      method: 'POST', headers: { 'Content-Type': 'application/json' },\n      body: JSON.stringify({ key, contentType, metadata: {\n        notes: record.notes, lat: record.lat, lng: record.lng,\n        capturedAt: record.capturedAt, distanceFt: record.distanceFt,\n        locationStatus: record.locationStatus, locationVerified: record.locationVerified,\n      } }),\n    });\n    if (!res.ok) throw new Error('presign failed');\n    const { uploadU
