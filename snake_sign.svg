<rect x="66" y="708" width="718" height="282" rx="22" fill="#FFFFFF" opacity="0.62"/>
<text x="425.0" y="744.0" text-anchor="middle" font-family="Poppins" font-weight="bold" font-size="20" fill="#2F5D43">Meet your scaly neighbor — quietly keeping you safe.</text>
<text x="425.0" y="780.0" text-anchor="middle" font-family="Poppins" font-size="18" fill="#4A3B2A">Here’s the deal: mice are basically tick taxis, and</text>
<text x="425.0" y="806.0" text-anchor="middle" font-family="Poppins" font-size="18" fill="#4A3B2A">the ticks they carry can spread</text>
<text x="425.0" y="840.0" text-anchor="middle" font-family="Poppins" font-weight="bold" font-size="23" fill="#C0392B">Rocky Mountain Spotted Fever.</text>
<text x="425.0" y="872.0" text-anchor="middle" font-family="Poppins" font-size="18" fill="#4A3B2A">Our resident rattlers love a good mouse snack — and every</text>
<text x="425.0" y="898.0" text-anchor="middle" font-family="Poppins" font-size="18" fill="#4A3B2A">mouse they eat is a whole crew of ticks that never bites you.</text>
<text x="93.8" y="940.0" text-anchor="start" font-family="Poppins" font-weight="bold" font-size="21" fill="#2F5D43">More snakes</text>
<g stroke="#C9803F" stroke-linecap="round"><line x1="241.6" y1="933.0" x2="258.6" y2="933.0" stroke-width="5"/><path d="M 265.6 933.0 L 255.6 927.0 L 255.6 939.0 Z" fill="#C9803F" stroke="none"/></g>
<text x="276.6" y="940.0" text-anchor="start" font-family="Poppins" font-weight="bold" font-size="21" fill="#2F5D43">fewer mice</text>
<g stroke="#C9803F" stroke-linecap="round"><line x1="406.7" y1="933.0" x2="423.7" y2="933.0" stroke-width="5"/><path d="M 430.7 933.0 L 420.7 927.0 L 420.7 939.0 Z" fill="#C9803F" stroke="none"/></g>
<text x="441.7" y="940.0" text-anchor="start" font-family="Poppins" font-weight="bold" font-size="21" fill="#2F5D43">fewer ticks</text>
<g stroke="#C9803F" stroke-linecap="round"><line x1="569.9" y1="933.0" x2="586.9" y2="933.0" stroke-width="5"/><path d="M 593.9 933.0 L 583.9 927.0 L 583.9 939.0 Z" fill="#C9803F" stroke="none"/></g>
<text x="604.9" y="940.0" text-anchor="start" font-family="Poppins" font-weight="bold" font-size="21" fill="#2F5D43">fewer worries.</text>
<text x="425.0" y="974.0" text-anchor="middle" font-family="Poppins" font-style="italic" font-size="15" fill="#80704F">Fun fact: one rattlesnake can clear out thousands of ticks a year — just by being a snake.</text>
<text x="425.0" y="1024.0" text-anchor="middle" font-family="Poppins" font-weight="bold" font-size="17" fill="#2F5D43">So if you spot one of our local rattlers, give a little wave — and say thanks!</text>
<text x="425.0" y="1051.0" text-anchor="middle" font-family="Poppins" font-size="13" fill="#9A7B53">Please admire from a respectful distance. Never touch or handle — give them space, and they’ll return the favor.</text>
</svg>
